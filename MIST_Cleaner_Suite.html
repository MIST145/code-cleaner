<style>
:root{--bg:#0B1622;--panel:#111f30;--accent:#007bff;--muted:#9aaabd;--line:rgba(0,123,255,.28)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#12365a 0,transparent 55%),var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 clamp(14px,4vw,40px);border-bottom:1px solid var(--line);background:rgba(7,17,29,.94);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.brand{font-weight:800;letter-spacing:.08em;color:#fff;font-size:1.05rem}.brand span{color:var(--accent);text-shadow:0 0 14px #007bff}

.back{display:none;background:rgba(0,123,255,.13);border:1px solid var(--line);color:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}
main{max-width:1120px;margin:auto;padding:clamp(28px,6vw,70px) 18px 48px}.hero{text-align:center;margin-bottom:38px}.eyebrow{color:#58a6ff;text-transform:uppercase;letter-spacing:.2em;font-size:.76rem;font-weight:800}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.08;margin:12px 0;color:#fff}.hero p{color:var(--muted);max-width:650px;margin:12px auto 0;line-height:1.6}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.tool-card{text-align:left;position:relative;min-height:260px;padding:28px;border-radius:18px;background:linear-gradient(145deg,rgba(21,42,64,.96),rgba(12,25,40,.96));border:1px solid var(--line);color:#fff;cursor:pointer;transition:.2s;box-shadow:0 16px 45px #0003}
.tool-card:hover,.tool-card:focus-visible{transform:translateY(-4px);border-color:#1688ff;box-shadow:0 18px 48px #007bff25;outline:none}.icon{width:54px;height:54px;display:grid;place-items:center;border-radius:15px;background:#007bff20;color:#58a6ff;font-size:1.8rem;margin-bottom:22px}
.tool-card h2{font-size:1.35rem;margin:0 0 10px}.tool-card p{color:#aab9c9;line-height:1.6;margin:0 0 22px}.launch{color:#58a6ff;font-weight:750}
#workspace{display:none;height:calc(100vh - 66px);min-height:520px}#appFrame{display:block;width:100%;height:100%;border:0;background:#0B1622}footer{text-align:center;color:#62758b;font-size:.78rem;padding:0 12px 24px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.tool-card{min-height:215px;padding:23px}.topbar{height:60px}#workspace{height:calc(100vh - 60px)}.brand{font-size:.92rem}}
